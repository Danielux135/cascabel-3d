# PUBLICA LA PRUEBA 3D DE CASCABEL: https://danielux.es/cascabel-3d/
#
# Este repo no guarda ni código ni builds: solo esta receta. Baja la rama
# `prueba-3d` de Danielux135/Cascabel, saca el build web con el preset "Web 3D"
# y lo sube a GitHub Pages de ESTE repo. Sale bajo danielux.es porque el sitio
# de usuario (Danielux135.github.io) tiene ese dominio, y los sitios de proyecto
# lo heredan con el nombre del repo detrás: por eso el repo se llama como la ruta.
#
# Va en un repo aparte para que la prueba no pueda pisar la página del juego
# (danielux.es/Cascabel/), que la publica el workflow de Cascabel desde master.
# Si la prueba se descarta, se borra este repo y no queda nada colgando.
#
# SE LANZA A MANO, desde la pestaña Actions ("Run workflow"), igual que la del
# juego: publicar es una decisión, no algo que pase con cada push.

name: Publicar la prueba 3D

on:
  workflow_dispatch:
    inputs:
      rama:
        description: "Rama de Cascabel que se publica"
        required: true
        default: prueba-3d

permissions:
  contents: read
  pages: write
  id-token: write

# Una publicación a la vez, y la que está en marcha no se corta.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  # La MISMA versión que el editor: las plantillas tienen que ser de la versión
  # exacta, y un build hecho con otro Godot no es lo que se ha probado.
  GODOT_RELEASE: 4.7.2-stable
  GODOT_TEMPLATES: 4.7.2.stable

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Bajar Cascabel
        uses: actions/checkout@v4
        with:
          repository: Danielux135/Cascabel
          ref: ${{ inputs.rama }}

      - name: Qué se va a publicar
        run: git log -1 --format='%h %ad %s' --date=short

      # El paquete de plantillas pesa 1,2 GB y de él solo hacen falta 10 MB: se
      # baja una vez, se queda lo web y se guarda en la caché nada más bajarlo.
      - name: Caché de Godot y sus plantillas web
        id: cache_godot
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates/${{ env.GODOT_TEMPLATES }}
          key: godot-${{ env.GODOT_RELEASE }}-web-nothreads-v1

      - name: Descargar Godot y las plantillas web
        if: steps.cache_godot.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}"
          motor="Godot_v${GODOT_RELEASE}_linux.x86_64.zip"
          plantillas="Godot_v${GODOT_RELEASE}_export_templates.tpz"
          destino="$HOME/.local/share/godot/export_templates/${GODOT_TEMPLATES}"
          mkdir -p "$RUNNER_TEMP/godot_dl" "$HOME/godot" "$destino"
          cd "$RUNNER_TEMP/godot_dl"
          curl -fsSL --retry 3 -O "$base/SHA512-SUMS.txt"
          curl -fsSL --retry 3 -O "$base/$motor"
          curl -fsSL --retry 3 -O "$base/$plantillas"
          # Lo que se baja se comprueba contra lo que publica Godot antes de
          # ejecutar nada.
          grep -E "  (${motor}|${plantillas})$" SHA512-SUMS.txt > comprobar.txt
          test "$(wc -l < comprobar.txt)" -eq 2
          sha512sum -c comprobar.txt
          unzip -q "$motor" -d "$HOME/godot"
          unzip -q -j "$plantillas" templates/version.txt \
            templates/web_nothreads_release.zip -d "$destino"
          rm -rf "$RUNNER_TEMP/godot_dl"

      - name: Guardar Godot en la caché
        if: steps.cache_godot.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates/${{ env.GODOT_TEMPLATES }}
          key: ${{ steps.cache_godot.outputs.cache-primary-key }}

      - name: Preparar Godot
        run: |
          echo "GODOT=$HOME/godot/Godot_v${GODOT_RELEASE}_linux.x86_64" >> "$GITHUB_ENV"
          chmod +x "$HOME/godot/Godot_v${GODOT_RELEASE}_linux.x86_64"
          ls -la "$HOME/.local/share/godot/export_templates/${GODOT_TEMPLATES}"

      # Sin importar no hay `.godot/`: ni recursos convertidos ni clases
      # registradas, y todo lo de abajo fallaría con "Could not find type".
      - name: Importar el proyecto
        run: '"$GODOT" --headless --path . --import'

      # La prueba usa el motor de colisiones del juego, así que la batería del
      # juego también la sujeta a ella. Un SCRIPT ERROR no sube el contador de
      # fallos, y aquí no lo mira nadie: se mira solo.
      - name: Batería del juego
        run: |
          set -euo pipefail
          "$GODOT" --headless --path . --script tests/prueba_sim.gd 2>&1 | tee "$RUNNER_TEMP/bateria.log"
          if grep -q "SCRIPT ERROR" "$RUNNER_TEMP/bateria.log"; then
            echo "::error::La batería tuvo un SCRIPT ERROR: hay pruebas que no se han ejecutado"
            exit 1
          fi
          grep -E "^OK +[0-9]+/[0-9]+ pruebas" "$RUNNER_TEMP/bateria.log"

      # La batería no cubre la escena 3D. Esto la arranca sin ventana y la deja
      # jugar seiscientos fotogramas: un error de script la tumba aquí, y no
      # delante de quien abra el enlace.
      - name: La escena 3D arranca
        run: |
          set -euo pipefail
          "$GODOT" --headless --path . res://prueba3d/prueba_3d.tscn --quit-after 600 2>&1 | tee "$RUNNER_TEMP/escena.log"
          if grep -qE "SCRIPT ERROR|Parse Error" "$RUNNER_TEMP/escena.log"; then
            echo "::error::La escena 3D tiene un error de script"
            exit 1
          fi

      # FUERA DEL REPO, como todo lo de paso: Godot escanea el proyecto entero.
      # Y SIEMPRE RELEASE.
      - name: Exportar el build web
        run: |
          set -euo pipefail
          salida="$RUNNER_TEMP/web"
          mkdir -p "$salida"
          "$GODOT" --headless --path . --export-release "Web 3D" "$salida/index.html"
          ls -la "$salida"
          test -s "$salida/index.html"
          test -s "$salida/index.wasm"
          test -s "$salida/index.pck"
          echo "SALIDA_WEB=$salida" >> "$GITHUB_ENV"

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir el build
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.SALIDA_WEB }}

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
